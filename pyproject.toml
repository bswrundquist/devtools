[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtools"
version = "1.0.0"
description = "Version-controlled Claude Code config: skills, agents, and starter CLAUDE.md files, installed into ~/.claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
devtools = "devtools:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devtools"]

# Ship the config alongside the code so `uvx --from git+...` has everything.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "devtools/_data/skills"
"agents" = "devtools/_data/agents"
"templates" = "devtools/_data/templates"
